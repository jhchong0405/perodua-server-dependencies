# Front nginx for two App deployments on one server, one per path.
# See docs/DEPLOYMENT.md, "Two environments on one server".
#
# Each deployment has PUBLIC_ROOT set to its path (/dev, /uat) and serves that
# path itself, so the path is passed on unchanged: proxy_pass has no URI part.
# Both deployments use BIND_IP=127.0.0.1, so run this nginx on the server
# itself (sudo apt-get install nginx), not in a container: a container on a
# Docker network cannot reach ports published on 127.0.0.1 of the server.
#
# Copy to /etc/nginx/conf.d/perodua-front.conf, set server_name and the two
# ports (each deployment's HTTP_PORT), then: sudo nginx -t && sudo systemctl reload nginx
# Remove the default site if it also listens on port 80 (/etc/nginx/sites-enabled/default).

upstream perodua_dev {
    server 127.0.0.1:8110;
}

upstream perodua_uat {
    server 127.0.0.1:8111;
}

server {
    listen 80;
    server_name stgissrp.perodua.com.my;

    # Redirects keep the host name and scheme the browser used (for example
    # behind F5 with HTTPS), instead of naming this server's own http:// address.
    absolute_redirect off;

    # As in the web container: attachments up to 128 MB, and slow imports and
    # reports up to 12 minutes.
    client_max_body_size 128m;
    proxy_connect_timeout 720s;
    proxy_send_timeout 720s;
    proxy_read_timeout 720s;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;

    location = /dev {
        return 302 /dev/;
    }
    location /dev/ {
        proxy_pass http://perodua_dev;
    }

    location = /uat {
        return 302 /uat/;
    }
    location /uat/ {
        proxy_pass http://perodua_uat;
    }

    # Everything else is closed.
    location / {
        return 404;
    }
}
